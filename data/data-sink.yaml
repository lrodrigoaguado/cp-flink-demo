apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: elastic-sink-location
  namespace: confluent
spec:
  class: "io.confluent.connect.elasticsearch.ElasticsearchSinkConnector"
  taskMax: 1
  connectClusterRef:
    name: connect
    namespace: confluent
  connectRest:
    endpoint: https://connect.confluent.svc.cluster.local:8083
    authentication:
      type: mtls
    tls:
      secretRef: connector-tls
  configs:
    name: "elastic-sink-location"
    connector.class: "io.confluent.connect.elasticsearch.ElasticsearchSinkConnector"
    topics: "vehicle-location"

    # --- Connection ---
    connection.url: "http://elasticsearch-es-http.confluent.svc.cluster.local:9200"
    connection.username: "elastic"
    connection.password: "elastic"

    # --- Behavior and error handling ---
    # One document per vehicle, updated in place. The record key is the vehicle_id
    # (string), so the Elasticsearch _id is the vehicle_id and the live map shows a
    # fixed set of dots that move smoothly instead of an ever-growing point cloud.
    key.ignore: "false"
    schema.ignore: "false"
    drop.invalid.message: "true"
    behavior.on.null.values: "IGNORE"
    behavior.on.malformed.documents: "IGNORE"
    write.method: "UPSERT"
    use.autogenerated.ids: "false"

    # --- Converters ---
    key.converter: "org.apache.kafka.connect.storage.StringConverter"

    value.converter: "io.confluent.connect.avro.AvroConverter"
    value.converter.schemas.enable: "true"
    value.converter.enhanced.avro.schema.support: "true"
    value.converter.schema.registry.url: "https://schemaregistry.confluent.svc.cluster.local:8081"
    value.converter.schema.registry.ssl.truststore.location: "/mnt/sslcerts/truststore.jks"
    value.converter.schema.registry.ssl.truststore.password: "confluent"
    value.converter.schema.registry.ssl.keystore.location: "/mnt/sslcerts/keystore.jks"
    value.converter.schema.registry.ssl.keystore.password: "confluent"
    value.converter.schema.registry.ssl.key.password: "confluent"

    linger.ms: "10"
    batch.size: "1"
    flush.timeout.ms: "5000"
---
apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: elastic-sink-alerts
  namespace: confluent
spec:
  class: "io.confluent.connect.elasticsearch.ElasticsearchSinkConnector"
  taskMax: 1
  connectClusterRef:
    name: connect
    namespace: confluent
  connectRest:
    endpoint: https://connect.confluent.svc.cluster.local:8083
    authentication:
      type: mtls
    tls:
      secretRef: connector-tls
  configs:
    name: "elastic-sink-alerts"
    connector.class: "io.confluent.connect.elasticsearch.ElasticsearchSinkConnector"
    topics: "vehicle-alerts-enriched"

    # --- Connection ---
    connection.url: "http://elasticsearch-es-http.confluent.svc.cluster.local:9200"
    connection.username: "elastic"
    connection.password: "elastic"

    # --- Behavior and error handling ---
    # Append-only: every alert is its own document so the map can show a recent,
    # fading time window of incidents (alerts are stamped with wall-clock detection
    # time in Flink, so a "last N minutes" window makes them transient).
    key.ignore: "true"
    schema.ignore: "false"
    drop.invalid.message: "true"
    behavior.on.null.values: "IGNORE"
    behavior.on.malformed.documents: "IGNORE"
    write.method: "INSERT"
    use.autogenerated.ids: "true"

    # --- Converters ---
    key.converter: "org.apache.kafka.connect.json.JsonConverter"
    key.converter.schemas.enable: "false"

    value.converter: "io.confluent.connect.avro.AvroConverter"
    value.converter.schemas.enable: "true"
    value.converter.enhanced.avro.schema.support: "true"
    value.converter.schema.registry.url: "https://schemaregistry.confluent.svc.cluster.local:8081"
    value.converter.schema.registry.ssl.truststore.location: "/mnt/sslcerts/truststore.jks"
    value.converter.schema.registry.ssl.truststore.password: "confluent"
    value.converter.schema.registry.ssl.keystore.location: "/mnt/sslcerts/keystore.jks"
    value.converter.schema.registry.ssl.keystore.password: "confluent"
    value.converter.schema.registry.ssl.key.password: "confluent"

    linger.ms: "10"
    batch.size: "1"
    flush.timeout.ms: "5000"
