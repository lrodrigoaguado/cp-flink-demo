version: '3.9'
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"     # S3 API (reached from Flink pods at host.docker.internal:9000)
      - "9001:9001"     # web console (http://localhost:9001 on the host)
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # One-shot: wait for MinIO, then create the bucket Flink checkpoints/savepoints live in.
  # Its exit code is the readiness gate used by run_all.sh (see phase_minio).
  createbuckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...'; sleep 1;
      done;
      mc mb --ignore-existing local/flink;
      echo 'Bucket flink ready';
      "

volumes:
  minio-data:

networks:
  default:
    name: cp-flink-minio-net
