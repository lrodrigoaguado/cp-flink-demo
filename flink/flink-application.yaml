apiVersion: platform.confluent.io/v1beta1
kind: FlinkApplication
metadata:
  name: flink-app1
  namespace: confluent
spec:
  flinkEnvironment: flink-env1
  image: flink-sql-runner-example
  flinkVersion: v2_1
  flinkConfiguration:
    "taskmanager.numberOfTaskSlots": "2"
    "taskmanager.memory.process.size": "2048m"
    "jobmanager.memory.process.size": "1024m"
    "taskmanager.memory.managed.fraction": "0.4"
    "metrics.reporter.prom.factory.class": "org.apache.flink.metrics.prometheus.PrometheusReporterFactory"
    "metrics.reporter.prom.port": "9249-9250"
    "rest.profiling.enabled": "true"
    "pekko.ask.timeout": 600s
    "pekko.tcp.timeout": 600s
    "heartbeat.timeout": "500000"
    # --- Checkpointing & savepoints to host MinIO (s3a) ---
    execution.checkpointing.interval: "30s"
    execution.checkpointing.mode: "EXACTLY_ONCE"
    state.checkpoints.dir: "s3a://flink/checkpoints"
    state.savepoints.dir: "s3a://flink/savepoints"
    state.checkpoints.num-retained: "5"
    s3.endpoint: "http://host.docker.internal:9000"
    s3.path.style.access: "true"
    s3.access-key: "minioadmin"
    s3.secret-key: "minioadmin"
    # This prevents the operator from deleting the failed JM pod immediately
    kubernetes.operator.reconcile.interval: 3600s
    # Optional: Increase the startup probe time so it doesn't fail so fast
    kubernetes.operator.jvm.fatal-error.shutdown: "false"
  serviceAccount: flink
  jobManager:
    resource:
      memory: 1024m
      cpu: 500m
  taskManager:
    resource:
      memory: 1024m
      cpu: 1000m
    replicas: 2
  job:
    jarURI: local:///opt/flink/usrlib/sql-runner.jar
    args:
      - "/opt/flink/usrlib/sql-scripts/kafka.sql"
    state: running
    parallelism: 2
    upgradeMode: savepoint
  cmfRestClassRef:
    name: cmfrestclass
    namespace: confluent
  podTemplate:
    spec:
      volumes:
        - name: flink-app1-tls
          secret:
            secretName: flink-app1-tls
      containers:
        - name: flink-main-container
          volumeMounts:
            - name: flink-app1-tls
              mountPath: /mnt/secrets/flink-app1-tls
              readOnly: true
